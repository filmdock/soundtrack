# Costruisce, firma e pubblica il pacchetto delle colonne sonore dall'ultimo dump di MusicBrainz.
# I dump completi escono il mercoledì e il sabato: si guarda il giovedì e la domenica.
# Senza il segreto SOUNDTRACK_SIGNING_KEY (o senza public-key.txt) si ferma prima di costruire:
# un pacchetto non firmato non viene mai pubblicato.
name: Build soundtrack pack

on:
  schedule:
    - cron: '0 6 * * 0,4'
  workflow_dispatch:
    inputs:
      allow_drop:
        description: Accept more than a 10% drop in albums from the previous build
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # il disco grande dei runner: il dump (7,6 GB) più le tabelle estratte non stanno nella radice
      WORK: /mnt/soundtrack
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Check the signing setup
        env:
          # solo «è impostato?», il valore non arriva a questo passo
          HAS_SIGNING_KEY: ${{ secrets.SOUNDTRACK_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::The repository secret SOUNDTRACK_SIGNING_KEY is missing: nothing is built or published without it."
            exit 1
          fi
          node verify.mjs --check-key

      - name: Unit tests
        run: node --test "test/**/*.test.mjs"

      - name: Install lbzip2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lbzip2

      - name: Prepare the work space
        run: |
          sudo mkdir -p "$WORK"
          sudo chown "$(id -u):$(id -g)" "$WORK"
          df -h "$WORK"
          # archivio 7,6 GB + tabelle estratte (stima 12-14 GB) nello stesso momento
          free_gb="$(df --output=avail -BG "$WORK" | tail -1 | tr -dc '0-9')"
          if [ "$free_gb" -lt 25 ]; then
            echo "::error::Only ${free_gb} GB free in $WORK, the build needs about 25 GB."
            exit 1
          fi

      - name: Build
        id: build
        env:
          ALLOW_DROP: ${{ inputs.allow_drop && '--allow-drop' || '' }}
        run: |
          node build.mjs --work "$WORK/work" --out "$WORK/out" $ALLOW_DROP
          df -h "$WORK"

      - name: Sign
        if: steps.build.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        env:
          SOUNDTRACK_SIGNING_KEY: ${{ secrets.SOUNDTRACK_SIGNING_KEY }}
        run: bash scripts/sign.sh "$WORK/out/soundtrack.json"

      - name: Verify before publishing
        if: steps.build.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        run: node verify.mjs --dir "$WORK/out" --deep

      - name: Publish the release
        if: steps.build.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          DUMP: ${{ steps.build.outputs.dump }}
        run: |
          set -euo pipefail
          out="$WORK/out"
          for f in soundtrack.sqlite.gz soundtrack.json soundtrack.json.sig; do
            test -s "$out/$f" || { echo "::error::$f is missing: nothing published."; exit 1; }
          done
          # una bozza rimasta da un giro fallito si toglie prima di ricrearla
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          albums="$(node -p "JSON.parse(require('fs').readFileSync('$out/soundtrack.json','utf8')).albums")"
          titles="$(node -p "JSON.parse(require('fs').readFileSync('$out/soundtrack.json','utf8')).titles")"
          notes="Soundtrack pack built from the MusicBrainz full export $DUMP: $albums albums, $titles IMDb titles.
          Data: MusicBrainz core data (CC0). Verify with public-key.txt (see README)."
          # prima bozza con i tre file, poi pubblicata: la release «latest» non resta mai a metà
          gh release create "$TAG" --draft --title "Soundtrack pack $DUMP" --notes "$notes" \
            "$out/soundtrack.sqlite.gz" "$out/soundtrack.json" "$out/soundtrack.json.sig"
          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$count" != "3" ]; then
            echo "::error::The draft has $count assets instead of 3: not published."
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest

      - name: Keep only the last 4 releases
        if: steps.build.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isDraft \
            --jq '[.[] | select((.tagName | startswith("pack-")) and (.isDraft | not)) | .tagName] | sort | reverse | .[4:] | .[]' |
            while read -r old; do
              echo "deleting $old"
              gh release delete "$old" --yes --cleanup-tag
            done

      - name: Record the build
        if: steps.build.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        env:
          DUMP: ${{ steps.build.outputs.dump }}
        run: |
          set -euo pipefail
          # anche attività del repo: GitHub spegne i workflow pianificati dei repo fermi da 60 giorni
          cp "$WORK/out/last-build.json" last-build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-build.json
          git commit -m "chore: pack $DUMP"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
